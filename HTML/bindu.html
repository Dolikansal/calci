<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Guru Chat</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4efe9 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            width: 90%;
            max-width: 800px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }
        .header {
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 1.8rem;
        }
        .header p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .user-message {
            align-self: flex-end;
            background-color: #4CAF50;
            color: white;
            border-bottom-right-radius: 5px;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 5px;
        }
        .bot-message::before {
            content: "🕉️";
            position: absolute;
            left: -30px;
            top: 0;
            font-size: 1.2rem;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background-color: white;
            border-top: 1px solid #eee;
            position: relative;
        }
        #user-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 1rem;
        }
        #user-input:focus {
            border-color: #4CAF50;
        }
        #send-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 0 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }
        #send-btn:hover {
            background-color: #3e8e41;
        }
        #send-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .typing-indicator {
            align-self: flex-start;
            background-color: #f0f0f0;
            color: #333;
            padding: 10px 15px;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            display: flex;
            align-items: center;
        }
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #666;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        .welcome-message {
            text-align: center;
            margin: 20px 0;
            color: #2E7D32;
            font-style: italic;
        }
        @media (max-width: 480px) {
            .input-area {
                padding-bottom: max(15px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Spiritual Guru</h1>
            <p>Ask me about meditation, spirituality, and the science behind it</p>
        </div>
        <div class="chat-container" id="chat-container">
            <div class="welcome-message">
                <p>Namaste 🙏<br>I am your spiritual guide. Ask me about meditation, mindfulness, or the connection between spirituality and science.</p>
            </div>
        </div>
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask your spiritual question..." autocomplete="off" aria-label="Type your spiritual question">
            <button id="send-btn" aria-label="Send message">Send</button>
        </div>
    </div>
    <script>
        // DOM elements
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Function to escape HTML to prevent XSS
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Function to add message to chat
        function addMessage(role, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', `${role}-message`);
            messageDiv.textContent = text; // text is already escaped
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to show typing indicator
        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('typing-indicator');
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Function to hide typing indicator
        function hideTyping() {
            const typingDiv = document.getElementById('typing-indicator');
            if (typingDiv) {
                typingDiv.remove();
            }
        }

        // Expanded bot responses
        function getBotResponse(userMessage) {
            const lowerMsg = userMessage.toLowerCase();
            
            if (/meditation|mindfulness/i.test(lowerMsg)) {
                const responses = [
                    "Meditation is the art of being present. Start with a few deep breaths and observe your thoughts without judgment. 🧘‍♂️",
                    "Mindfulness meditation can help reduce stress and increase focus. Try focusing on your breath for 5 minutes.",
                    "In meditation, we don't seek to empty the mind, but to become aware of its movements without attachment."
                ];
                return responses[Math.floor(Math.random() * responses.length)];
            } else if (/science/i.test(lowerMsg)) {
                return "Science and spirituality are not at odds. Studies show mindfulness practices can reduce stress, improve focus, and even change brain structure in areas related to attention and emotional regulation.";
            } else if (/hello|hi|namaste|greetings/i.test(lowerMsg)) {
                return "Namaste 🙏 How can I assist you on your spiritual journey today?";
            } else if (/yoga|asana/i.test(lowerMsg)) {
                return "Yoga is more than physical postures. It's a union of body, mind, and spirit. The asanas prepare the body for meditation.";
            } else if (/meaning of life|purpose/i.test(lowerMsg)) {
                return "The journey of life is about discovering your true nature beyond the ego. Each moment is an opportunity for awakening.";
            } else if (/stress|anxiety|worry/i.test(lowerMsg)) {
                return "When stressed, return to your breath. Observe your thoughts like clouds passing in the sky - they come and go.";
            } else {
                const defaultResponses = [
                    "Interesting question. From a spiritual perspective, all answers lie within. Have you tried meditating on this?",
                    "The path to wisdom begins with inquiry. Perhaps explore this question through mindful contemplation.",
                    "Every question is a step toward understanding. Could you rephrase or ask about meditation or mindfulness?"
                ];
                return defaultResponses[Math.floor(Math.random() * defaultResponses.length)];
            }
        }

        // Main chat function
        async function chat(userMessage) {
            const sanitizedMessage = escapeHtml(userMessage);
            addMessage('user', sanitizedMessage);
            
            // Disable input during processing
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            showTyping();
            
            setTimeout(() => {
                hideTyping();
                try {
                    const botText = getBotResponse(userMessage);
                    addMessage('bot', botText);
                } catch (error) {
                    addMessage('bot', "I'm experiencing some difficulty. Please try again later.");
                    console.error("Error generating response:", error);
                }
                
                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 1000 + Math.random() * 1000); // Random delay for more natural feel
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function sendMessage() {
            const message = userInput.value.trim();
            if (message) {
                chat(message);
                userInput.value = '';
            }
        }

        // Initial greeting
        setTimeout(() => {
            addMessage('bot', "Namaste seeker 🙏 What wisdom can I share with you today?");
        }, 1000);

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
